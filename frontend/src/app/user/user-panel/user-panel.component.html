<div class="container mt-5">
  <h2 class="mb-4">User Dashboard</h2>

  <!-- Live Search -->
  <div class="input-group mb-4">
    <input type="text" class="form-control" placeholder="Search by country or capital"
           [(ngModel)]="keyword" (keyup)="search()">
    <span class="input-group-text"><i class="bi bi-search"></i></span>
  </div>

  <!-- Destinations Grid -->
  <div class="row">
    <div class="col-lg-4 col-md-6 mb-4" *ngFor="let dest of destinations">
      <div class="card h-100 shadow-sm">
        <img [src]="dest.flagUrl" class="card-img-top" alt="flag" style="height: 180px; object-fit: cover;">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title">{{ dest.country }}</h5>
          <p class="card-text mb-2">
            Capital: {{ dest.capital }}<br>
            Region: {{ dest.region }}<br>
            Population: {{ dest.population | number }}<br>
            Currency: {{ dest.currency }}
          </p>
          <button class="btn btn-success mt-auto" (click)="markWantToVisit(dest.id)">Want to Visit</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Pagination -->
  <div class="d-flex justify-content-between mt-4">
    <button class="btn btn-outline-primary" (click)="prevPage()" [disabled]="page === 0">Previous</button>
    <button class="btn btn-outline-primary" (click)="nextPage()" [disabled]="page + 1 >= totalPages">Next</button>
  </div>
</div>
